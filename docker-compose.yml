services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    shm_size: 1gb # Chromium crashes on Docker's default 64 MB
    expose:
      - "8000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  caddy-data:
